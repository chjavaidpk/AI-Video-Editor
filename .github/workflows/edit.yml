name: Ultimate One-Time API Drive Video Editor

on:
  workflow_dispatch:
    inputs:
      gdrive_url:
        description: 'Google Drive Folder Shareable Link or ID'
        required: true

jobs:
  ai_fresh_edit:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install System Dependencies & Python Packages
      run: |
        sudo apt-get update
        sudo apt-get install -y ffmpeg curl fonts-dejavu
        python -m pip install --upgrade pip
        pip install --upgrade --no-cache-dir google-api-python-client google-auth-httplib2 google-auth-oauthlib

    - name: Process Video & Direct Save To Drive
      env:
        GDRIVE_URL: ${{ github.event.inputs.gdrive_url }}
        GDRIVE_SA_JSON: ${{ secrets.GDRIVE_SERVICE_ACCOUNT }}
      run: |
        cat << 'EOF' > auto_drive_process.py
        import subprocess, sys, os, glob, random, json, re, time
        from google.oauth2 import service_account
        from googleapiclient.discovery import build
        from googleapiclient.http import MediaFileUpload, MediaIoBaseDownload
        import io

        g_url = os.environ.get('GDRIVE_URL', '').strip()
        sa_json_str = os.environ.get('GDRIVE_SA_JSON', '').strip()

        os.makedirs("edited_output", exist_ok=True)
        os.makedirs("temp_download", exist_ok=True)

        if not sa_json_str:
            print("❌ Error: GDRIVE_SERVICE_ACCOUNT secret missing in GitHub!")
            sys.exit(1)

        def extract_id(url_or_id):
            match = re.search(f'folders/([a-zA-Z0-9_-]+)', url_or_id)
            if match:
                return match.group(1)
            match_file = re.search(f'd/([a-zA-Z0-9_-]+)', url_or_id)
            if match_file:
                return match_file.group(1)
            if re.match(r'^[a-zA-Z0-9_-]+$', url_or_id):
                return url_or_id
            return url_or_id

        folder_or_file_id = extract_id(g_url)

        try:
            sa_info = json.loads(sa_json_str)
            creds = service_account.Credentials.from_service_account_info(
                sa_info, scopes=['https://www.googleapis.com/auth/drive']
            )
            drive_service = build('drive', 'v3', credentials=creds)
            print("🔑 Google Drive API Authenticated!")

            # Check inside user's provided shared folder or main target
            target_folder_id = folder_or_file_id

        except Exception as e:
            print(f"❌ Drive Authentication Failed: {e}")
            sys.exit(1)

        print("🔍 Scanning raw videos directly via Google Drive API...")
        
        query_src = f"'{folder_or_file_id}' in parents and mimeType contains 'video/' and trashed=false"
        try:
            results = drive_service.files().list(
                q=query_src, 
                fields="files(id, name, mimeType)",
                supportsAllDrives=True,
                includeItemsFromAllDrives=True
            ).execute()
            items = results.get('files', [])
        except Exception:
            try:
                file_single = drive_service.files().get(
                    fileId=folder_or_file_id, 
                    fields="id, name, mimeType",
                    supportsAllDrives=True
                ).execute()
                items = [file_single] if file_single else []
            except Exception as ex:
                print(f"❌ Drive API Fetch Error: {ex}")
                items = []

        if not items:
            print("❌ No videos found in the provided Drive folder/link!")
            print("⚠️ Please ensure the source Drive folder is SHARED with your Service Account email as Editor.")
            sys.exit(1)

        print(f"🔥 Found {len(items)} video(s). Downloading & Processing...\n")

        font_path = "/usr/share/fonts/truetype/dejavu/DejaVuSans-Bold.ttf"

        for idx, item in enumerate(items, 1):
            file_id = item['id']
            file_name = item['name']
            download_path = os.path.join("temp_download", file_name)

            print("==================================================")
            print(f"📥 Downloading [{idx}/{len(items)}]: {file_name}")
            print("==================================================")

            request = drive_service.files().get_media(fileId=file_id)
            with open(download_path, 'wb') as f:
                downloader = MediaIoBaseDownload(f, request)
                done = False
                while not done:
                    status, done = downloader.next_chunk()

            clean_filename = os.path.splitext(file_name)[0] + "_AI_FRESH.mp4"
            final_output_path = os.path.join("edited_output", clean_filename)

            print(f"🎬 Processing (Anti-Reused Content + Blur Background + Perfect Sync): {clean_filename}")

            contrast_val = round(random.uniform(1.03, 1.08), 2)
            saturation_val = round(random.uniform(1.05, 1.12), 2)
            noise_val = random.randint(5, 8)

            # Complex Filtergraph for Reused Content Bypass (Blur bg + Rescaling + Hflip + Color Alteration)
            filter_complex = (
                "[0:v]hflip,scale=1920:1080:force_original_aspect_ratio=increase,crop=1920:1080,gblur=sigma=35[bg];"
                "[0:v]hflip,scale=1660:934:force_original_aspect_ratio=decrease,"
                f"eq=contrast={contrast_val}:saturation={saturation_val}:brightness=0.015:gamma=1.02,"
                f"noise=alls={noise_val}:allf=t+u,unsharp=3:3:1.0:3:3:1.0[fg];"
                "[bg][fg]overlay=(W-w)/2:(H-h)/2[v1];"
                f"[v1]drawtext=fontfile='{font_path}':text='AI SETORI':x=w-text_w-35:y=35:fontsize=26:fontcolor=white@0.22[outv]"
            )

            # Anti-Audio Reuse + Exact 1:1 Audio-Video Sync
            filter_a = "volume=1.04,asetrate=44100*1.012,aresample=44100:async=100000:min_hard_comp=0.100000:first_pts=0,atempo=1/1.012"

            ffmpeg_cmd = [
                'ffmpeg', '-y',
                '-i', download_path,
                '-filter_complex', filter_complex,
                '-map', '[outv]',
                '-map', '0:a?',
                '-af', filter_a,
                '-c:v', 'libx264',
                '-preset', 'fast',
                '-crf', '24',
                '-b:v', '1800k',
                '-maxrate', '2400k',
                '-bufsize', '4500k',
                '-pix_fmt', 'yuv420p',
                '-vsync', 'cfr',
                '-metadata', 'title=Original AI Content Render',
                '-metadata', 'artist=AI Setori Studio',
                '-metadata', 'encoder=Lavf60.3.100',
                '-c:a', 'aac',
                '-b:a', '128k',
                '-ar', '44100',
                final_output_path
            ]

            result = subprocess.run(ffmpeg_cmd)

            if result.returncode == 0:
                print(f"✅ Editing Complete: {clean_filename}")
                print(f"☁️ Auto Uploading Directly to Shared Folder...")
                
                # Fixed: Enforce uploading directly to shared user parent folder using supportsAllDrives
                file_metadata = {'name': clean_filename, 'parents': [target_folder_id]}
                media = MediaFileUpload(final_output_path, mimetype='video/mp4', chunksize=5*1024*1024, resumable=True)
                
                request_upload = drive_service.files().create(
                    body=file_metadata, 
                    media_body=media, 
                    fields='id',
                    supportsAllDrives=True
                )
                
                uploaded_file = None
                response = None
                retry_count = 0
                while response is None:
                    try:
                        status, response = request_upload.next_chunk()
                        if status:
                            print(f"  --> Upload Progress: {int(status.progress() * 100)}%")
                    except Exception as upload_err:
                        retry_count += 1
                        print(f"⚠️ Connection retry ({retry_count}/5)... Error: {upload_err}")
                        time.sleep(5)
                        if retry_count > 5:
                            raise upload_err

                print(f"🎉 Saved Successfully in Drive! File ID: {response.get('id')}\n")

            else:
                print(f"❌ Failed to process: {file_name}\n")

            try:
                os.remove(download_path)
            except Exception:
                pass

        print("🎉 All videos edited & saved directly into Google Drive Folder!")

        EOF

        python auto_drive_process.py
        
